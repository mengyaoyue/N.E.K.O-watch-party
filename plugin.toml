[plugin]
name = "陪看猫娘"
description = "陪主人看B站视频喵：说「陪我看」或猫娘截屏探测到主人在看视频，就打开陪看开关，按可自定义的节奏高频自主截屏，看到笑点/名场面/梗就主动吐槽接梗，看不到就安静等着——全程没有任何播放进度，不报时间、不猜进度。预学习（抓弹幕/字幕/热评存本地）是可选的辅助素材，不跑也能陪看。新增：面板自定义截屏频率与开关；自带窗口登录B站（持久化会话）解锁字幕；视觉模型看画面失败自动降级本地 OCR。"
short_description = "Catgirl watches Bilibili with you: a single switch + custom screenshot cadence drives autonomous screen-watching comments. No playback progress at all. Optional pre-learning."
keywords = ["陪看", "watch", "bilibili", "B站", "弹幕", "danmaku", "共情", "猫娘", "neko", "视频", "video", "字幕", "subtitle", "视觉", "vision", "截屏", "screenshot"]
version = "0.6.0"
type = "plugin"
id = "neko_watch_party"
entry = "plugin.plugins.neko_watch_party:WatchPartyPlugin"

[plugin.author]
name = "MENGYAOYUE"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = false

[plugin.store]
enabled = true

[neko_watch_party]
# 陪看开关打开（在看视频）时的截屏节奏：每多少秒截一帧看画面并自主评论（5-600，面板可改）
shot_interval_active = 20
# 开关关闭时的待机探测节奏：每多少秒截一帧判断主人在不在看视频（10-3600，面板可改）
shot_interval_idle = 120
# 自动探测：待机时低频截屏，发现主人在看视频就自动打开陪看开关（面板可关）
auto_detect = true
# 预学习（可选辅助）：开才抓弹幕/字幕/热评存本地素材，用来理解画面里的梗；不开也能陪看
prelearn = false
# B站 SESSDATA（浏览器 F12 复制，填了可解锁字幕模式；留空用弹幕模式）
bili_sessdata = ""
# 截屏看片：截取画面让猫娘"看见"内容，看到才评论（隐私敏感可关；关了基本不说话）
screen_assist = true
# 看片用多模态视觉模型（true=视觉模型描述画面；失败自动降级本地 OCR）
screen_vision = true
# 视觉模型超时（秒）
vision_timeout = 25
# 视觉模型覆盖：四项留空则用宿主设置里的 vision / 对话模型通道；填了就用插件自己的
# 任意 OpenAI 兼容厂商都行（DeepSeek / 通义 / 智谱 / OpenAI …），provider_type 可留空自动识别
vision_model = ""
vision_base_url = ""
vision_api_key = ""
vision_provider_type = ""
# B站接口请求超时（秒）
request_timeout = 15
# 看屏生成反应调用大模型超时（秒）
llm_timeout = 45
# 调度轮询间隔（秒）
poll_interval = 2
# 结束陪看时自动输出总结
auto_summary = true
catgirl_name = "猫娘"
master_name = "主人"
