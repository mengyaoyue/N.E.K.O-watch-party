# 陪看猫娘（neko_watch_party）配置示例

[plugin_runtime]
enabled = true
auto_start = false

[neko_watch_party]
reaction_count = 10
# 反应密度：每分钟几条（1-10，面板里可改，下次预习生效）
reactions_per_minute = 3
# 预习完成后自动开始同步陪看（true=一步式；false=等用户说"开始看"）
auto_begin = true
# 陪看心跳：每 N 分钟轻推一句进度（0=关闭）
heartbeat_minutes = 3
# 反应密度随时长自适应（每 45 秒一个反应点，上限 60）
auto_density = true
# B站 SESSDATA（浏览器 F12 复制，填了可解锁字幕模式；留空用弹幕模式）
bili_sessdata = ""
# 截屏辅助：截取主屏画面做本地 OCR，让猫娘"看见"画面（默认关；隐私敏感请保持关闭）
screen_assist = false
# 开启截屏辅助时，"刚才那段"是否截屏（否则只用心跳时的截图）
screen_on_react = true
request_timeout = 15
llm_timeout = 45
poll_interval = 2
auto_summary = true
catgirl_name = "猫娘"
master_name = "主人"
