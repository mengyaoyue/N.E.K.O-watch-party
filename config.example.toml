# 陪看猫娘（neko_watch_party）配置示例

[plugin_runtime]
enabled = true
auto_start = false

[neko_watch_party]
# 陪看开关打开（在看视频）时的截屏节奏：每多少秒截一帧看画面并自主评论（5-600，面板可改）
shot_interval_active = 20
# 开关关闭时的待机探测节奏：每多少秒截一帧判断主人在不在看视频（10-3600，面板可改）
shot_interval_idle = 120
# 自动探测：待机时低频截屏，发现主人在看视频就自动打开陪看开关（面板可关）
auto_detect = true
# 预学习（可选辅助）：开才抓弹幕/字幕/热评存本地素材，用来理解画面里的梗；不开也能陪看
prelearn = false
# B站 SESSDATA（浏览器 F12 复制，填了可解锁字幕模式；留空用弹幕模式）
bili_sessdata = ""
# 截屏看片：截取画面让猫娘"看见"内容，看到才评论（隐私敏感可关；关了基本不说话）
screen_assist = true
# 看片用多模态视觉模型（true=视觉模型描述画面；失败自动降级本地 OCR）
screen_vision = true
# 思考模式作用范围：none=都保留思考；chat=只关"出话"的思考；vision=只关"看画面"的思考；all=两条都关（最快，默认）
thinking_mode = "all"
# 视觉模型超时（秒）
vision_timeout = 25
# ↓ 视觉模型覆盖：四项留空则用宿主设置里的 vision / 对话模型通道；填了就用插件自己的
# 任意 OpenAI 兼容厂商都行（DeepSeek / 通义 / 智谱 / OpenAI …），provider_type 可留空自动识别
vision_model = ""
vision_base_url = ""
vision_api_key = ""
vision_provider_type = ""
request_timeout = 15
llm_timeout = 45
poll_interval = 2
auto_summary = true
catgirl_name = "猫娘"
master_name = "主人"
